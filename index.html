<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="일본어 단어와 문장을 번역하고, 듣고, 저장하는 도우미 앱">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>일본어 도우미</title>
<style>
*{box-sizing:border-box}
:root{--ink:#000;--line:#000;--accent:#1d4ed8;--sub:#444;--paper:#fff}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
body{min-height:100vh;padding-bottom:96px}

/* 상단 */
.top{padding:18px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{margin:0;font-size:26px;font-weight:800}
#installApp{border:2px solid var(--line);background:#fff;border-radius:14px;min-height:44px;padding:0 14px;font-size:16px;font-weight:700;display:none}

/* 화면 전환 */
main{padding:0 16px 16px}
.panel{display:none}
.panel.active{display:block}
h2{font-size:22px;font-weight:800;margin:14px 2px 12px}
.guide{font-size:16px;color:var(--sub);margin:-4px 2px 14px;line-height:1.5}

/* 카드 */
.card{border:2px solid var(--line);border-radius:20px;padding:14px;background:#fff}
#source{display:block;width:100%;min-height:124px;border:2px solid var(--line);border-radius:16px;padding:16px;font:inherit;font-size:20px;line-height:1.45;color:var(--ink);background:#fff;resize:none}
#source::placeholder{color:#777}
.langs button.on{background:#dc2626;border-color:#dc2626;color:#fff}
.langs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.langs button{min-height:46px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font:inherit;font-size:17px;font-weight:700}
.btn{min-height:56px;border:2px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);font:inherit;font-size:18px;font-weight:700;padding:0 14px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-size:20px;font-weight:800;margin-top:12px}
.btn.small{min-height:48px;font-size:16px;width:auto;padding:0 12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.linkish{display:block;margin:12px auto 0;background:none;border:0;font:inherit;font-size:16px;font-weight:700;color:var(--sub);text-decoration:underline;padding:8px}

/* 결과 */
.out{margin-top:16px;border-top:2px dashed var(--line);padding-top:16px;min-height:150px}
#result{font-size:26px;font-weight:800;line-height:1.4;white-space:pre-wrap;word-break:break-word;min-height:58px}
.placeholder{color:#777;font-size:18px;font-weight:600}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.note{font-size:14px;color:var(--sub);line-height:1.55;margin:14px 2px 0}

/* 목록·복습 */
.search{width:100%;min-height:56px;border:2px solid var(--line);border-radius:16px;padding:0 16px;font:inherit;font-size:18px;color:var(--ink);background:#fff}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 4px}
#list{margin-top:8px}
.item{border:2px solid var(--line);border-radius:18px;padding:14px;margin-top:12px}
.item .jp{font-size:22px;font-weight:800;line-height:1.35;word-break:break-word}
.item .ko{font-size:17px;color:var(--sub);margin-top:6px;line-height:1.45}
.item .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.item .acts button{min-height:48px;border:2px solid var(--line);border-radius:12px;background:#fff;font:inherit;font-size:16px;font-weight:700}
.empty{border:2px dashed var(--line);border-radius:18px;padding:22px 16px;font-size:18px;line-height:1.6;text-align:center;margin-top:14px}
.flash{border:2px solid var(--line);border-radius:20px;padding:20px 16px;min-height:170px;font-size:24px;font-weight:800;line-height:1.5;white-space:pre-wrap;word-break:break-word;display:flex;align-items:center;justify-content:center;text-align:center}

/* 사진 */
.photo-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo-btns label{min-height:64px;border:2px solid var(--line);border-radius:16px;background:#fff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.photo-btns label.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.hidden{display:none!important}
.preview{margin-top:14px;border:2px solid var(--line);border-radius:16px;overflow:hidden;height:300px;background:#fff;position:relative}
.preview .view{width:100%;height:100%;overflow:auto;display:flex}
#preview{margin:auto;max-width:none;width:100%;transform-origin:center center;transition:transform .15s}
.zoombar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.zoombar button{min-height:52px;border:2px solid var(--line);border-radius:14px;background:#fff;font:inherit;font-size:17px;font-weight:700}
.ocr-result{white-space:pre-wrap;word-break:break-word;font-size:18px;line-height:1.55;font-weight:600}

/* 아래 메뉴 */
.tabs{position:fixed;left:0;right:0;bottom:0;height:84px;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:2px solid var(--line);z-index:5;padding-bottom:env(safe-area-inset-bottom)}
.tab{border:0;background:#fff;color:var(--sub);font:inherit;font-size:15px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tab .ic{font-size:26px;line-height:1}
.tab.active{color:var(--accent)}
.tab.active .ic{transform:scale(1.08)}
</style>
</head>
<body>

<header class="top">
  <h1 style="font-size:22px;white-space:nowrap">일본어 도우미 <span style="font-size:13px;font-weight:700;color:var(--sub)">v15 · 26-11-22 00시 58분</span></h1>
  <button id="installApp" type="button">앱 설치</button>
</header>

<main>

  <!-- 번역 -->
  <section id="translate" class="panel active">
    <h2>번역</h2>
    <div class="card">
      <div class="inbox">
        <textarea id="source" placeholder="예: 이 메뉴는 무엇인가요?" aria-label="번역할 내용"></textarea>
      </div>
      <div class="langs" role="group" aria-label="말하기 언어와 지우기">
        <button id="langKo" type="button" >한국어</button>
        <button id="langJa" type="button" >일본어</button>
        <button id="clearBtn" type="button">지우기</button>
      </div>
      <button id="translateBtn" class="btn primary" type="button">번역하기</button>

      <div class="out">
        <div id="result" class="placeholder"></div>
        <div class="actions">
          <button id="speakBtn" class="btn" type="button">🔊 듣기</button>
          <button id="saveBtn" class="btn" type="button">＋ 저장</button>
        </div>
      </div>
    </div>
      </section>

  <!-- 단어장 -->
  <section id="saved" class="panel">
    <h2>내 단어장</h2>
    <input id="search" class="search" type="search" placeholder="한국어나 일본어로 찾기" aria-label="단어장 검색">
    <div class="tools">
      <button id="exportBtn" class="btn small" type="button">백업 저장</button>
      <label class="btn small" style="cursor:pointer">백업 불러오기<input id="importFile" type="file" accept=".json" class="hidden"></label>
    </div>
    <div id="list"></div>
      </section>

  <!-- 복습 -->
  <section id="study" class="panel">
    <h2>복습</h2>
    <div id="flash" class="flash" style="font-size:44px;min-height:150px"></div>
    <div id="meaning" class="card" style="margin-top:12px;font-size:32px;font-weight:700;line-height:1.5;min-height:150px;white-space:pre-wrap;text-align:center;display:flex;flex-direction:column;justify-content:center"></div>
    <div class="actions" style="grid-template-columns:1fr 1fr 1fr">
      <button id="revealBtn" class="btn" type="button">뜻</button>
      <button id="saveStudyBtn" class="btn" type="button">저장</button>
      <button id="deleteBtn" class="btn" type="button">삭제</button>
    </div>
    <button id="allBtn" class="btn" type="button" style="margin-top:12px">가타카나 전체 보기</button>
    <div id="allList" style="display:none;margin-top:12px"></div>
  </section>

  <!-- 사진 -->
  <section id="photo" class="panel">
    <h2>사진 번역</h2>
    <div class="photo-btns">
      <label class="primary">📷 바로 찍기<input id="cameraFile" type="file" accept="image/*" capture="environment" class="hidden"></label>
      <label>사진 고르기<input id="galleryFile" type="file" accept="image/*" class="hidden"></label>
    </div>

    <div id="previewWrap" class="hidden">
      <div class="preview"><div class="view"><img id="preview" alt="선택한 사진"></div></div>
      <div class="zoombar">
        <button id="zoomOut" type="button">작게 −</button>
        <button id="zoomReset" type="button">원래대로</button>
        <button id="zoomIn" type="button">크게 +</button>
      </div>
    </div>

    <button id="ocrBtn" class="btn primary" type="button">사진 글자 읽기</button>
    <div id="ocrResult" class="card ocr-result" style="margin-top:14px;min-height:110px"></div>
  </section>

</main>

<nav class="tabs" aria-label="메뉴">
  <button class="tab active" data-tab="translate" type="button"><span class="ic">🌐</span>번역</button>
  <button class="tab" data-tab="saved" type="button"><span class="ic">📖</span>단어장</button>
  <button class="tab" data-tab="study" type="button"><span class="ic">🔁</span>복습</button>
  <button class="tab" data-tab="photo" type="button"><span class="ic">📷</span>사진</button>
</nav>

<script>
const $=id=>document.getElementById(id);
let lastJp="",items=JSON.parse(localStorage.getItem("jphelper_items")||"[]"),current=-1,zoom=1;
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab,.panel").forEach(x=>x.classList.remove("active"));b.classList.add("active");$(b.dataset.tab).classList.add("active");if(b.dataset.tab==="saved")renderList();if(b.dataset.tab==="study")studyOpen()});
function detect(s){return /[ぁ-んァ-ン一-龯]/.test(s)?"ja":"ko"}
async function translate(s){
 if(!s.trim()) throw Error("번역할 내용을 입력하세요.");
 const sl=detect(s)==="ja"?"ja":"ko",tl=sl==="ja"?"ko":"ja";
 const u="https://translate.googleapis.com/translate_a/single?client=gtx&sl="+sl+"&tl="+tl+"&dt=t&q="+encodeURIComponent(s);
 const r=await fetch(u);if(!r.ok)throw Error("번역 서버에 연결하지 못했습니다.");
 const d=await r.json();return d[0].map(x=>x[0]).join("");
}
function showResult(text,cls){const el=$("result");el.textContent=text;el.className=cls||""}
$("translateBtn").onclick=async()=>{const s=$("source").value;showResult("번역 중…","placeholder");try{lastJp=await translate(s);showResult(lastJp)}catch(e){showResult(e.message+" 인터넷 연결을 확인하세요.","placeholder")}};
$("clearBtn").onclick=()=>{$("source").value="";showResult("","placeholder");lastJp=""};
$("speakBtn").onclick=()=>{const t=lastJp||$("result").textContent;if(!t||t.startsWith("번역"))return;const u=new SpeechSynthesisUtterance(t);u.lang=/[ぁ-んァ-ン一-龯]/.test(t)?"ja-JP":"ko-KR";speechSynthesis.speak(u)};
let mic=null;
function listen(lang,btn){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){alert("이 브라우저는 말하기를 지원하지 않습니다. 크롬을 써 주세요.");return}
 if(mic){mic.want=false;mic.r&&mic.r.stop();return}
 const src=$("source"),ph=src.placeholder;
 const st={want:true,r:null,base:src.value,final:""};
 mic=st;
 const finish=()=>{st.want=false;btn.classList.remove("on");src.placeholder=ph;if(mic===st)mic=null};
 const start=()=>{
  const r=new SR();st.r=r;
  r.lang=lang;r.continuous=true;r.interimResults=true;r.maxAlternatives=1;
  r.onstart=()=>{btn.classList.add("on");src.placeholder="듣는 중…"};
  r.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)st.final+=t;else interim+=t}src.value=st.base+st.final+interim};
  r.onerror=e=>{if(e.error==="no-speech"||e.error==="aborted")return;if(e.error==="not-allowed"||e.error==="service-not-allowed"){st.want=false;alert("마이크 권한을 허용해 주세요.")}};
  r.onend=()=>{
   if(!st.want){finish();return}
   st.base=src.value;st.final="";
   try{start()}catch(err){finish()}
  };
  try{r.start()}catch(err){finish();alert("다시 한 번 눌러 주세요.")}
 };
 start();
}
$("langKo").onclick=()=>listen("ko-KR",$("langKo"));
$("langJa").onclick=()=>listen("ja-JP",$("langJa"));
function persist(){localStorage.setItem("jphelper_items",JSON.stringify(items));renderList()}
$("saveBtn").onclick=()=>{const ko=$("source").value.trim(),jp=$("result").textContent.trim();if(!ko||!jp||jp.startsWith("번역")){alert("먼저 번역을 완료하세요.");return}items.unshift({ko,jp,created:Date.now()});persist();alert("단어장에 저장했습니다.")};
function renderList(){const q=$("search").value.toLowerCase();$("list").innerHTML="";const shown=items.filter(x=>(x.ko+x.jp).toLowerCase().includes(q));shown.forEach(x=>{const d=document.createElement("div");d.className="item";const a=document.createElement("div");a.className="jp";a.textContent=x.jp;const b=document.createElement("div");b.className="ko";b.textContent=x.ko;const c=document.createElement("div");c.className="acts";const del=document.createElement("button");del.textContent="삭제";del.onclick=()=>{if(confirm("삭제할까요?")){items.splice(items.indexOf(x),1);persist()}};c.style.gridTemplateColumns="1fr";c.append(del);a.style.cursor="pointer";a.onclick=()=>speakJa(x.jp);d.append(a,b,c);$("list").append(d)})}
$("search").oninput=renderList;
$("exportBtn").onclick=()=>{const blob=new Blob([JSON.stringify(items,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="일본어_단어장.json";a.click();URL.revokeObjectURL(a.href)};
$("importFile").onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(Array.isArray(data)){items=[...data,...items];persist();alert("가져왔습니다.")}}catch{alert("올바른 백업 파일이 아닙니다.")}};
let marks=JSON.parse(localStorage.getItem("jphelper_marks")||"[]"),onlyMarks=false;
let allCards=[],deck=[],deckIdx=-1,removedIds=JSON.parse(localStorage.getItem("jphelper_removed")||"[]");
function speakJa(t){const u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";speechSynthesis.speak(u)}
function ngHtml(s){return [...s].map(ch=>ch==='ン'?'<span style="display:inline-block;text-align:center;line-height:1"><span style="display:block;font-size:8px;font-weight:400;color:#444;line-height:1.2">엉</span>ン</span>':ch).join('')}
async function studyOpen(){
 if(!deck.length){const all=await (await fetch("katakana_easy_1000.json?v=10")).json();allCards=all;deck=all.filter(x=>!removedIds.includes(x.id))}
 if(deckIdx<0||!deck[deckIdx])showCard();
}
function showCard(){
 $("meaning").textContent="";
 if(!deck.length){$("flash").textContent="모든 카드를 끝냈습니다";deckIdx=-1;return}
 deckIdx=Math.floor(Math.random()*deck.length);
 $("flash").textContent=deck[deckIdx].katakana;
}
$("flash").onclick=()=>{if(deckIdx>=0)speakJa(deck[deckIdx].katakana)};
$("revealBtn").onclick=()=>{if(deckIdx<0)return;const c=deck[deckIdx];$("meaning").textContent=c.english+"\n"+c.korean};
$("saveStudyBtn").onclick=()=>{if(deckIdx<0)return;const c=deck[deckIdx];items.unshift({ko:c.korean+" ("+c.english+")",jp:c.katakana,created:Date.now()});persist();showCard();$("meaning").textContent="단어장에 저장했습니다."};
function applyFilter(){$("allList").querySelectorAll("[data-id]").forEach(el=>{el.style.display=(!onlyMarks||marks.includes(el.dataset.id))?"block":"none"})}
$("allBtn").onclick=async()=>{
 const open=$("allList").style.display==="none";
 if(open){
  if(!allCards.length)allCards=await (await fetch("katakana_easy_1000.json?v=10")).json();
  $("allList").innerHTML='<div style="display:flex;gap:8px;margin-bottom:12px"><input id="numInput" type="number" placeholder="번호 입력" style="flex:1;min-height:52px;border:2px solid #000;border-radius:12px;padding:0 14px;font-size:18px;font-family:inherit"><button id="numGo" type="button" aria-label="찾기" style="width:60px;min-height:52px;border:2px solid #000;border-radius:12px;background:#fff;font-size:20px">🔍</button></div><button id="markFilter" type="button" style="width:100%;min-height:52px;border:2px solid #000;border-radius:12px;background:#fff;font-size:18px;font-weight:700;margin-bottom:12px">'+(onlyMarks?"전체 보기":"책갈피만 보기")+'</button>'+allCards.map((c,i)=>'<div id="kc-'+(i+1)+'" data-id="'+c.id+'" style="border:2px solid #000;border-radius:16px;padding:14px;margin-bottom:12px"><div style="font-size:14px;font-weight:700;margin-bottom:6px">'+(i+1)+'</div>'+
   '<div style="display:flex;align-items:center;gap:10px">'+
    '<div data-k="'+c.katakana+'" style="flex:1;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:32px;font-weight:700;cursor:pointer">'+ngHtml(c.katakana)+
     '<span data-r="'+i+'" style="display:none;font-size:18px;font-weight:400;color:#444;margin-top:4px">'+(c.ko_read||"")+'</span></div>'+
    '<button data-bm="'+c.id+'" type="button" aria-label="책갈피" style="width:52px;min-height:52px;border:2px solid #000;border-radius:12px;font-size:20px;background:'+(marks.includes(c.id)?'#000;color:#fff':'#fff')+'">🔖</button>'+'<button data-b="'+i+'" type="button" style="width:72px;min-height:52px;border:2px solid #000;border-radius:12px;background:#fff;font-size:18px;font-weight:700">뜻</button>'+
   '</div>'+
   '<div data-m="'+i+'" style="display:none;margin-top:12px;border-top:2px solid #000;padding-top:12px;justify-content:space-between;align-items:center;font-size:26px;font-weight:700"><span>'+c.korean+'</span><span>'+c.english+'</span></div>'+
  '</div>').join("");
  $("allList").style.display="block";$("allBtn").textContent="가타카나 전체 닫기";applyFilter();
 }else{$("allList").style.display="none";$("allBtn").textContent="가타카나 전체 보기"}
};
$("allList").addEventListener("keydown",e=>{if(e.target.id==="numInput"&&e.key==="Enter")$("numGo").click()});
$("allList").onclick=e=>{
 if(e.target.closest("#numGo")){const n=parseInt($("numInput").value,10);const el=n?document.getElementById("kc-"+n):null;if(el)el.scrollIntoView({behavior:"smooth",block:"center"});else alert("번호를 확인하세요.");return}
 const bm=e.target.closest("[data-bm]");
 if(bm){const id=bm.dataset.bm;marks=marks.includes(id)?marks.filter(x=>x!==id):[...marks,id];localStorage.setItem("jphelper_marks",JSON.stringify(marks));const on=marks.includes(id);bm.style.background=on?"#000":"#fff";bm.style.color=on?"#fff":"#000";applyFilter();return}
 if(e.target.closest("#markFilter")){onlyMarks=!onlyMarks;e.target.closest("#markFilter").textContent=onlyMarks?"전체 보기":"책갈피만 보기";applyFilter();return}
 const kd=e.target.closest("[data-k]");
 if(kd){speakJa(kd.dataset.k);const r=kd.querySelector("[data-r]");if(r)r.style.display="block";return}
 const bt=e.target.closest("[data-b]");
 if(bt){const m=$("allList").querySelector('[data-m="'+bt.dataset.b+'"]');if(m)m.style.display=m.style.display==="flex"?"none":"flex"}
};
$("deleteBtn").onclick=()=>{if(deckIdx<0)return;const c=deck[deckIdx];removedIds.push(c.id);localStorage.setItem("jphelper_removed",JSON.stringify(removedIds));deck.splice(deckIdx,1);showCard()};
let selectedPhoto=null;
function usePhoto(f){if(!f)return;selectedPhoto=f;$("preview").src=URL.createObjectURL(f);$("previewWrap").classList.remove("hidden");zoom=1;setZoom();}
$("cameraFile").onchange=e=>usePhoto(e.target.files[0]);
$("galleryFile").onchange=e=>usePhoto(e.target.files[0]);
function setZoom(){$("preview").style.transform="scale("+zoom+")"}
$("zoomIn").onclick=()=>{zoom=Math.min(zoom+.25,3);setZoom()};
$("zoomOut").onclick=()=>{zoom=Math.max(zoom-.25,1);setZoom()};
$("zoomReset").onclick=()=>{zoom=1;setZoom()};
$("ocrBtn").onclick=async()=>{
 const f=selectedPhoto;if(!f){alert("먼저 사진을 찍거나 고르세요.");return}
 $("ocrResult").textContent="글자 읽기 엔진을 불러오는 중…";
 try{
  if(!window.Tesseract){await new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";s.onload=ok;s.onerror=no;document.head.append(s)})}
  const r=await Tesseract.recognize(f,"jpn",{logger:m=>{if(m.status==="recognizing text")$("ocrResult").textContent="글자 읽는 중… "+Math.round((m.progress||0)*100)+"%"}});
  const jp=r.data.text.trim();
  if(!jp){$("ocrResult").textContent="글자를 읽지 못했습니다. 글자가 크게 나오도록 가까이서 다시 찍어 주세요.";return}
  $("source").value=jp;$("ocrResult").textContent="【일본어】\n"+jp+"\n\n【한국어】\n번역 중…";
  try{const ko=await translate(jp);lastJp=ko;$("ocrResult").textContent="【일본어】\n"+jp+"\n\n【한국어】\n"+ko}
  catch(e){$("ocrResult").textContent="【읽은 일본어】\n"+jp+"\n\n번역에 실패했습니다. 번역 탭에서 다시 시도해 주세요."}
 }catch(e){$("ocrResult").textContent="사진 글자 읽기에 실패했습니다. 인터넷 연결을 확인하고 다시 시도하세요."}
};
renderList();

let installPromptEvent=null;
const installButton=$("installApp");
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPromptEvent=e;installButton.style.display="inline-block"});
installButton.addEventListener("click",async()=>{
 if(!installPromptEvent){alert("크롬 메뉴에서 '앱 설치' 또는 '홈 화면에 추가'를 선택하세요.");return}
 installPromptEvent.prompt();await installPromptEvent.userChoice;installPromptEvent=null;installButton.style.display="none";
});
window.addEventListener("appinstalled",()=>{installButton.style.display="none"});
if("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost")){
 window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>

<script>
(function(){
let kanjiData=null, wordData=null, loading=null;
const res=document.getElementById("result");
const box=document.createElement("div");
box.id="check";
box.style.cssText="padding:8px 0;font-size:14px;";
res.insertAdjacentElement("afterend",box);
function loadDicts(){
  if(!loading){
    loading=Promise.all([
      fetch("kanji_readings.json").then(r=>r.json()),
      fetch("word_readings.json").then(r=>r.json())
    ]).then(v=>{kanjiData=v[0];wordData=v[1];});
  }
  return loading;
}
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function check(jp){
  const out=[];
  const runs=jp.match(/[一-鿿々]+[ぁ-ゖ]*/g)||[];
  for(const r of runs){
    const word=r.replace(/[ぁ-ゖ]+$/,"");
    if(!word) continue;
    const cands=wordData[word];
    if(cands && cands.length){
      out.push({t:word, reading:cands[0], note: cands.length>1 ? "읽기 여러 개, 확인 필요" : "단어 사전 일치"});
      continue;
    }
    if(word.length===1 && kanjiData[word]){
      const d=kanjiData[word];
      const all=d.on.concat(d.kun);
      out.push({t:word, reading:all.join(" / "), note: all.length>1 ? "한자 사전, 읽기 여러 개" : "한자 사전 일치"});
      continue;
    }
    out.push({t:word, reading:null, note:"사전에 없음, 확인 필요"});
  }
  return out;
}
function render(items){
  if(!items.length){box.innerHTML="";return;}
  box.innerHTML='<div style="font-weight:500;margin-bottom:6px;">읽기 확인</div>'+
    items.map(it=>'<div style="display:flex;justify-content:space-between;gap:8px;padding:4px 0;"><span>'+esc(it.t)+'</span><span>'+(it.reading?esc(it.reading):"-")+'</span><span>'+esc(it.note)+'</span></div>').join("")+
    '<div style="margin-top:8px;font-size:12px;color:#777;">출처: EDRDG (CC BY-SA) · v15 · 26-11-22 00시 58분</div>';
}
function stemsFor(kuns,after){const out=[];for(const k of kuns){for(let n=Math.min(k.length-1,after.length);n>=1;n--){if(k.endsWith(after.slice(0,n))){const s=k.slice(0,k.length-n);if(s&&!out.includes(s))out.push(s);break}}}return out}
function rubyCands(run,after){
 if(wordData[run]&&wordData[run].length)return wordData[run];
 if(run.length===1&&kanjiData[run]){const kun=kanjiData[run].kun||[];const st=stemsFor(kun,after);if(st.length)return st;if(kun.length&&!after)return kun.slice(0,1)}
 return []
}
function showRuby(jp){
 const parts=jp.split(/([一-鿿々]+)/);let h="";
 for(let i=0;i<parts.length;i++){
  const p=parts[i];if(!p)continue;
  if(i%2===0){h+=esc(p);continue}
  const nx=parts[i+1]||"";const m=nx.match(/^[ぁ-ゖ]*/);const after=m?m[0]:"";
  const c=rubyCands(p,after);
  if(!c.length){h+=esc(p);continue}
  h+='<ruby class="jr" data-c="'+encodeURIComponent(JSON.stringify(c))+'">'+esc(p)+'<rt'+(c.length>1?' style="text-decoration:underline dotted"':'')+'>'+esc(c[0])+'</rt></ruby>';
 }
 $("ruby").innerHTML=h;
}
const rv=document.createElement("div");rv.id="ruby";rv.style.cssText="font-size:26px;font-weight:800;line-height:2.2;word-break:break-word;margin-top:8px";res.insertAdjacentElement("afterend",rv);
rv.onclick=e=>{const r=e.target.closest&&e.target.closest("ruby.jr");if(!r)return;const c=JSON.parse(decodeURIComponent(r.dataset.c));if(c.length<2)return;const rt=r.querySelector("rt");const i=(c.indexOf(rt.textContent)+1)%c.length;rt.textContent=c[i]};
new MutationObserver(()=>{
  const t=res.textContent.trim();
  if(!t||t.startsWith("번역")){render([]);rv.innerHTML="";return;}
  loadDicts().then(()=>{render(check(t));showRuby(t)}).catch(()=>{box.textContent="사전 파일을 못 불러왔습니다.";});
}).observe(res,{childList:true,characterData:true,subtree:true});
})();
</script>
